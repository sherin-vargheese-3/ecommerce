name: shop

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-shop}
      DB_USERNAME: ${POSTGRES_USER:-shop}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-shop}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-please-32-bytes-min}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-PT1H}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shop.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://localhost:5173
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
