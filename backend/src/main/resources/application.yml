spring:
  application:
    name: shop
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shop}
    username: ${DB_USERNAME:shop}
    password: ${DB_PASSWORD:shop}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Loads lazy associations for a page of rows in batches instead of one query per row.
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # Must be at least 32 bytes for HS256. Override in every non-local environment.
    secret: ${JWT_SECRET:local-dev-secret-change-me-please-32-bytes-min}
    expiration: ${JWT_EXPIRATION:PT1H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:admin@shop.local}
    password: ${ADMIN_PASSWORD:admin12345}
